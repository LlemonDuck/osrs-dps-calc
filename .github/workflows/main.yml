name: Build, run tests, and deploy if necessary

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: LlemonDuck
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v4
        id: meta
        with:
          images: ghcr.io/llemonduck/osrs-dps-calc
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BASE_URL=https://dps.llemonduck.dev
            BASE_PATH=
            SHORTLINK_URL=https://dps.llemonduck.dev
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/llemonduck'
    steps:
      - name: Restart Service
        run: |
          eval $(ssh-agent)
          ssh-add - <<< "${{ secrets.SSH_DEPLOY_KEY }}"
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} /home/${{ secrets.SSH_USER }}/deploy.sh dps
